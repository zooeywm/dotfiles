#!/usr/bin/nft -f
# Managed by ~/.dotfiles (root/etc/nftables.conf), deploy with: sudo ./deploy.nu root
#
# Modern nftables host firewall (replaces ufw / iptables-nft):
# deny public inbound, trust loopback, LANs and virtual interfaces,
# keep forwarding open for libvirt / podman NAT.

destroy table inet archwm

table inet archwm {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state established,related accept
        iif lo accept

        # trusted virtual interfaces
        iifname "tailscale0" accept
        iifname "Meta" accept        # clash TUN
        iifname "virbr0" accept      # libvirt NAT
        iifname "podman0" accept

        # trusted LANs
        ip saddr 10.100.0.0/22 accept
        ip saddr 192.168.0.0/16 accept
        ip saddr 172.16.0.0/12 accept

        # DHCP client + tailscale direct
        udp dport 68 accept
        udp dport 41641 accept

        # ICMP / ICMPv6: ping, PMTU, neighbour discovery
        icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
