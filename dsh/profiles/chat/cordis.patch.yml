# 主人聊天 harness（dsh --profile chat，常驻 ACP 进程）：
# 庭宇 provider + deepseek-v4.1-flash；联网工具由 MCP（qq-chat-mcp-web）提供；
# 允许在"工作区目录"里读写文件（沙箱 workspace-write），但关掉 bash/jobs。
# 工作区由启动进程的 cwd 决定（qq-chat-bot 用 OWNER_WORKSPACE 启动它）。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      tingyu:
        apiKeyEnv: TINGYU_API_KEY
        api: openai-completions
        baseURL: https://tokens.tingyutech.cn/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            input: [text, image]
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: tingyu
    model: deepseek-v4.1-flash
- id: acp
  config:
    provider: tingyu
    model: deepseek-v4.1-flash
- id: system-prompt
  config:
    personaPrefix: >-
      你是 YUKO，在 QQ 上和主人聊天。需要实时信息时用 web_search / web_fetch 查，
      不要凭空编造事实。你可以在当前工作区目录里读、写、改文件（fs 工具），
      但不能执行 shell 命令；工作区外的路径不要碰。主人发表情包、图片、截图时，
      直接看图理解（表情包就回应它的情绪/梗，图片/截图就描述或回答其中的内容），
      不要说"看不到图片"。回复用简洁自然的中文（一般不超过 150 字），不要用
      Markdown 标题或代码块，不要提及模型名、harness 或内部配置。
- id: sandbox-policy
  config:
    mode: workspace-write
- id: user-approval
  config:
    policy: 'never'
- id: tool-web
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
