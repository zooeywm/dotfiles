# Managed by ~/.dotfiles (root/etc/sysctl.d/99-desktop.conf), deploy with: sudo ./deploy.nu root
#
# 桌面调优：zswap 友好的内存策略、大写入不卡顿、外网下载更稳。

# 有 zswap 时优先压缩换出，而不是丢掉 page cache
vm.swappiness = 100
# zswap 每次换入 1 页，减小读放大
vm.page-cluster = 0
# 27G 内存下限制脏页上限，避免大写入时 I/O 卡顿
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# TCP：高延迟/跨洋链路更稳、建连更快
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
