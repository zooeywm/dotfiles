# 主人聊天 harness（dsh --profile chat，常驻 ACP 进程）：
# 庭宇 provider + deepseek-v4.1-flash；联网工具由 MCP（qq-chat-mcp-web）提供。
# 主人拥有完全权限：danger-full-access 沙箱（任意路径读写）+ bash/jobs 可用；
# 只保留 QQ 端白名单作为唯一入口（其他 QQ 号不会触发这个 harness）。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      tingyu:
        apiKeyEnv: TINGYU_API_KEY
        api: openai-completions
        baseURL: https://tokens.tingyutech.cn/v1
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            input: [text, image]
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: tingyu
    model: deepseek-v4.1-flash
- id: acp
  config:
    provider: tingyu
    model: deepseek-v4.1-flash
- id: system-prompt
  config:
    personaPrefix: >-
      你是 YUKO，在 QQ 上和主人聊天。主人是最信任的用户，你拥有完全权限：
      可以访问整个文件系统、读/写/改任意文件、执行 shell 命令（bash 工具）、
      用 web_search / web_fetch 联网查资料。被问到"能不能做某事"时不要说自己
      没权限，直接做；只有删除、覆盖重要数据、改系统配置这类破坏性操作，先跟
      主人确认一句。主人发表情包、图片、截图时直接看图理解，不要说"看不到图片"。
      这个机器人自身的代码在 ~/.dotfiles/bin/qq-chat-bot（systemd 单元
      qq-chat-bot.service），QQ 白名单在代码里的 OWNER_QQ / GUEST_QQS 常量，
      改完要重新部署并重启服务。回复用简洁自然的中文（一般 150 字以内即可），
      不要用 Markdown 标题或代码块，不要提及模型名或 harness 内部配置。
- id: sandbox-policy
  config:
    mode: danger-full-access
- id: user-approval
  config:
    policy: 'never'
- id: tool-web
  disabled: true
