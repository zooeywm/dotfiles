# 由 ~/.dotfiles 管理（sudo ./deploy.nu root 部署）
# 合盖不挂起：由 niri switch-events 关闭显示器（见 niri/config.kdl）
# 睡眠/休眠仍可手动触发（suspend.target / hibernate.target 未屏蔽）
#
# 2026-11-11 追加：禁掉键盘上的睡眠/休眠键
# 起因：打字时外接键盘（Milsky mini84EC(S)_RT）发出 KEY_SUSPEND/KEY_POWER，
#       导致「挂起 + 重启」两个请求打架，系统直接重启。
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore

# 睡眠键 / 休眠键（含长按）一律忽略
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore

# 电源键：短按仍然关机（长按 4 秒的硬件强制断电不受此配置影响）
HandlePowerKey=poweroff
HandlePowerKeyLongPress=ignore
