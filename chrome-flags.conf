# Managed by ~/.dotfiles (chrome-flags.conf), deploy with: ./deploy.nu
#
# Radeon 780M 走 VA-API 硬解（与 chromium-flags.conf 一致）。
# 若某次更新后视频解码异常，直接删掉对应行即可。
--ozone-platform=wayland
--enable-features=VaapiVideoDecodeLinuxGL,VaapiVideoDecoder
--enable-zero-copy
# 重启/强杀后也强制恢复上次会话的标签
--restore-last-session
# 本机 DevTools 远程调试（127.0.0.1:9222），供自动化/调试使用
--user-data-dir=/home/zooeywm/.config/chrome-debug
--remote-debugging-port=9222
